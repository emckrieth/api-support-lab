<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Observed checkout decisions by rules version</title><desc id="desc">The 180 dollar checkout is approved, reviewed, then approved. The 1200 dollar checkout is approved, reviewed, then remains reviewed.</desc><rect width="960" height="300" rx="16" fill="#101827"/><g font-family="Arial,sans-serif" fill="#f1f5f9"><text x="28" y="38" font-size="22" font-weight="bold">Six observed HTTP decisions</text><text x="28" y="64" font-size="14" fill="#cbd5e1">Generated evidence summary, not a screenshot | fictional transactions | all HTTP 200</text><rect x="28" y="88" width="282" height="170" rx="10" fill="#1e293b"/><text x="44" y="120" font-size="20" font-weight="bold">Baseline</text><text x="44" y="145" font-size="14" fill="#cbd5e1">Rules 2026.10.1</text><text x="44" y="185" font-size="16">$180: APPROVE / 0</text><text x="44" y="224" font-size="16">$1,200: APPROVE / 20</text><rect x="338" y="88" width="282" height="170" rx="10" fill="#1e293b"/><text x="354" y="120" font-size="20" font-weight="bold">Regression</text><text x="354" y="145" font-size="14" fill="#cbd5e1">Rules 2026.10.2</text><text x="354" y="185" font-size="16">$180: REVIEW / 45</text><text x="354" y="224" font-size="16">$1,200: REVIEW / 45</text><rect x="648" y="88" width="282" height="170" rx="10" fill="#1e293b"/><text x="664" y="120" font-size="20" font-weight="bold">Hotfix</text><text x="664" y="145" font-size="14" fill="#cbd5e1">Rules 2026.10.3</text><text x="664" y="185" font-size="16">$180: APPROVE / 0</text><text x="664" y="224" font-size="16">$1,200: REVIEW / 45</text></g></svg>