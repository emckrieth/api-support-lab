# Unit tests for alert_rules.yml. Run with:
#   promtool test rules monitoring/alert_rules_test.yml
rule_files:
  - alert_rules.yml

evaluation_interval: 1m

tests:
  # Healthy traffic: 95% approvals, no alerts.
  - interval: 1m
    input_series:
      - series: 'risk_decisions_total{decision="approve",rules_version="2026.10.1"}'
        values: "0+19x60"
      - series: 'risk_decisions_total{decision="review",rules_version="2026.10.1"}'
        values: "0+1x60"
      - series: 'http_requests_total{route="/risk/decisions",method="POST",status="200"}'
        values: "0+20x60"
    alert_rule_test:
      - eval_time: 40m
        alertname: RiskApprovalRateDrop
        exp_alerts: []
      - eval_time: 40m
        alertname: ApiHigh5xxRate
        exp_alerts: []

  # Bad rules release: approvals fall to ~40% and HIGH_AMOUNT fires on 60% of decisions.
  - interval: 1m
    input_series:
      - series: 'risk_decisions_total{decision="approve",rules_version="2026.10.2"}'
        values: "0+8x60"
      - series: 'risk_decisions_total{decision="review",rules_version="2026.10.2"}'
        values: "0+10x60"
      - series: 'risk_decisions_total{decision="decline",rules_version="2026.10.2"}'
        values: "0+2x60"
      - series: 'risk_reason_codes_total{code="HIGH_AMOUNT",decision="review"}'
        values: "0+10x60"
      - series: 'risk_reason_codes_total{code="HIGH_AMOUNT",decision="decline"}'
        values: "0+2x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: RiskApprovalRateDrop
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "Risk approval rate below 80% for 10 minutes"
              description: "Customers may be blocked. Check risk_rules_info for a recent rules change and follow docs/fraud-false-positive-runbook.md."
      - eval_time: 30m
        alertname: RiskReasonCodeSurge
        exp_alerts:
          - exp_labels:
              severity: ticket
              code: HIGH_AMOUNT
            exp_annotations:
              summary: "Reason code HIGH_AMOUNT fires on more than 40% of decisions"
              description: "A single signal dominating decisions usually points to a rule or data change, not a fraud wave."

  # Provider timeouts: 10% of requests return 504.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{route="/risk/decisions",method="POST",status="200"}'
        values: "0+18x60"
      - series: 'http_requests_total{route="/risk/decisions",method="POST",status="504"}'
        values: "0+2x60"
    alert_rule_test:
      - eval_time: 20m
        alertname: ApiHigh5xxRate
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "More than 5% of API requests failing with 5xx"
              description: "Check app_incident_mode and the error events in /admin/logs for timeout or provider auth failures."
